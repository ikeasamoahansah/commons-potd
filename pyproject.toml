[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-potd"
version = "1.0.0"
description = "Set your desktop wallpaper to the Wikimedia Commons Picture of the Day, with a confirmation preview."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ikeasamoahansah" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pillow>=10.0"]
keywords = ["wallpaper", "wikimedia", "commons", "picture-of-the-day", "linux"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop",
]
urls = { Homepage = "https://github.com/ikeasamoahansah/commons-potd" }
scripts = { potd = "potd.__main__:main" }

[tool.setuptools]
packages = ["potd"]
